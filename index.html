<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =========================
         BASIC SEO
    ========================== -->
    <title>Kirti Rathore | Creator, Vlogger & Storyteller</title>

    <meta
      name="description"
      content="Official portfolio of Kirti Rathore — content creator, vlogger and storyteller sharing lifestyle reels, daily moments, vlogs and creative content."
    />

    <meta
      name="keywords"
      content="Kirti Rathore, Rathore Vlogs, content creator, vlogger, lifestyle creator, Instagram creator, YouTube vlogger, reels, daily vlogs"
    />

    <meta name="author" content="Kirti Rathore" />

    <meta name="robots" content="index, follow" />

    <meta name="theme-color" content="#17101d" />

    <!-- =========================
         OPEN GRAPH
         WhatsApp / Facebook / LinkedIn
    ========================== -->
    <meta
      property="og:title"
      content="Kirti Rathore | Creator & Vlogger"
    />

    <meta
      property="og:description"
      content="Vlogs, reels, everyday moments and creative stories by Kirti Rathore."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:image"
      content="/images/main-photo.jpeg"
    />

    <meta
      property="og:image:alt"
      content="Kirti Rathore - Creator and Vlogger"
    />

    <meta property="og:site_name" content="Kirti Rathore" />

    <!-- =========================
         TWITTER / X PREVIEW
    ========================== -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Kirti Rathore | Creator & Vlogger"
    />

    <meta
      name="twitter:description"
      content="Vlogs, reels and everyday moments by Kirti Rathore."
    />

    <meta
      name="twitter:image"
      content="/images/main-photo.jpeg"
    />

    <!-- =========================
         FAVICON
    ========================== -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- =========================
         GOOGLE FONTS
    ========================== -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
